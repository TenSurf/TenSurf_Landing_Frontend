version: "3.9"
services:
  tensurf-ui-preview:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    mem_limit: 512m
    cpus: 0.5
    networks:
      - tensurf_network

networks:
  tensurf_network:
    name: tensurf_network
    external: true
