version: "3.9"

services:
  tensurf-ui-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tensurf-ui-dev
    restart: always
    env_file:
      - .env
    ports:
      - "3002:3000"
    networks:
      - tensurf_network

networks:
  tensurf_network:
    name: tensurf_network
    external: true
